name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Obsidian publisher diagnostics
        run: npm run check:publisher

      - name: Check formatting
        run: npm run format:check

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Verify output
        run: |
          if [ ! -f main.js ]; then
            echo "Build failed: main.js not found"
            exit 1
          fi
          echo "Build successful: main.js exists"

      # `npm run build` prettifies the bundle in place, so a clean build reproduces the
      # committed main.js byte for byte. When it does not, the committed bundle and the
      # released one are different artifacts — which is invisible to every other check
      # here, since an unformatted bundle still exists, still types, and still runs.
      - name: Verify the built bundle matches the committed one
        run: |
          if ! git diff --quiet -- main.js; then
            echo "Built main.js differs from the committed main.js"
            git diff --stat -- main.js
            exit 1
          fi
          echo "Built main.js is byte-identical to the committed bundle"

      # Obsidian installs only main.js, styles.css and manifest.json, so the topology
      # worker is inlined into the bundle. A build that dropped the payload would pass
      # every other check and fail at runtime in an installed vault.
      - name: Verify the topology worker is inlined
        run: |
          if grep -q "__TOPOLOGY_WORKER_SOURCE__" main.js; then
            echo "main.js still contains the worker placeholder: the esbuild define did not run"
            exit 1
          fi
          if [ "$(grep -c "persistence-result" main.js)" -lt 2 ]; then
            echo "main.js does not contain the inlined topology worker"
            exit 1
          fi
          echo "Inlined topology worker present"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # These gate the documented performance budgets. scripts/verify.mjs runs them too,
      # and claims to mirror this file step for step, so they belong here as well.
      - name: Static topology benchmark
        run: npm run benchmark:topology

      - name: Persistence benchmark
        run: npm run benchmark:persistence
