name: Release

on:
  push:
    tags:
      - "*"

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify manifest version matches the release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "Release tag $TAG does not match manifest.json version $MANIFEST"
            exit 1
          fi
          echo "Version $MANIFEST matches the tag"

      # `npm run build` prettifies main.js itself, so the bundle released here is
      # byte-identical to the one committed to the repo.
      - name: Build production
        run: npm run build

      - name: Verify output
        run: |
          for asset in main.js styles.css manifest.json; do
            if [ ! -f "$asset" ]; then
              echo "Build failed: $asset not found"
              exit 1
            fi
          done
          echo "Build successful: main.js, styles.css and manifest.json exist"

      # Attest the exact bytes that are about to become release assets. The previous
      # workflow attested files it then uploaded with actions/upload-artifact, which
      # produces a workflow artifact rather than a release asset — so the assets people
      # actually download carried no provenance.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json

      # Create the release and attach its required files in one operation. Triggering
      # this workflow after a release is published leaves a window where Obsidian's
      # publisher sees a release with no assets and rejects it.
      - name: Create GitHub Release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" main.js styles.css manifest.json --verify-tag --generate-notes

      - name: Verify the published assets are attested
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for asset in main.js styles.css manifest.json; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done
