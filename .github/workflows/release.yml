name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish or repair (for example, 0.4.5)"
        required: true
        type: string

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Resolve release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify manifest version matches the release tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          TAG="${RELEASE_TAG#v}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "Release tag $TAG does not match manifest.json version $MANIFEST"
            exit 1
          fi
          echo "Version $MANIFEST matches the tag"

      # `npm run build` prettifies main.js itself, so the bundle released here is
      # byte-identical to the one committed to the repo.
      - name: Build production
        run: npm run build

      - name: Verify output
        run: |
          for asset in main.js styles.css manifest.json; do
            if [ ! -f "$asset" ]; then
              echo "Build failed: $asset not found"
              exit 1
            fi
          done
          echo "Build successful: main.js, styles.css and manifest.json exist"

      # Attest the exact bytes that are about to become release assets. The previous
      # workflow attested files it then uploaded with actions/upload-artifact, which
      # produces a workflow artifact rather than a release asset — so the assets people
      # actually download carried no provenance.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json

      # A tag push creates the release and assets together. A manual run can repair an
      # existing release (including 0.4.5) by replacing incomplete or stale assets.
      - name: Publish or repair GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" main.js styles.css manifest.json --clobber
          else
            gh release create "$RELEASE_TAG" main.js styles.css manifest.json --verify-tag --generate-notes
          fi

      - name: Verify the published assets are attested
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for asset in main.js styles.css manifest.json; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done
